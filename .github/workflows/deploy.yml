name: Deploy to Bloxity Legion

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:
    inputs:
      target:
        type: choice
        options: [staging, prod]
        default: staging

env:
  REGISTRY: ghcr.io
  # Repo variable, set under Settings -> Secrets and variables -> Actions -> Variables.
  # Must match the lowercase game ID created on the Bloxity "My Games" dashboard
  # (the client's GAME_SLUG in src/config.js: run-a-motel).
  GAME_ID: ${{ vars.LEGION_GAME_ID || secrets.LEGION_GAME_ID }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npm test

  # Every push deploys to prod, and to stage too once the repo has LEGION_DEPLOY_TOKEN_STAGE
  # (docs.bloxity.io > Environments > Release flow). Run workflow picks one platform.
  targets:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.t.outputs.list }}
    steps:
      - id: t
        env:
          HAS_STAGE_TOKEN: ${{ secrets.LEGION_DEPLOY_TOKEN_STAGE != '' }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then echo 'list=["${{ inputs.target }}"]' >> "$GITHUB_OUTPUT"
          elif [ "$HAS_STAGE_TOKEN" != "true" ]; then echo 'list=["prod"]' >> "$GITHUB_OUTPUT"
          else echo 'list=["prod","staging"]' >> "$GITHUB_OUTPUT"; fi

  deploy:
    # Pull requests only run the tests above; deploys happen on push / manual run.
    if: github.event_name != 'pull_request'
    needs: [test, targets]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # staging can never take prod down with it
      matrix:
        target: ${{ fromJSON(needs.targets.outputs.list) }}
    env:
      LEGION_URL: ${{ matrix.target == 'staging' && 'https://legion.stage.bloxity.io' || 'https://legion.bloxity.io' }}
      # A staging job only ever reads the stage token (never the prod one).
      LEGION_DEPLOY_TOKEN: ${{ secrets[matrix.target == 'staging' && 'LEGION_DEPLOY_TOKEN_STAGE' || 'LEGION_DEPLOY_TOKEN'] }}
      # Images are tagged per platform, so a staging build never replaces a production image.
      TAG_PREFIX: ${{ matrix.target == 'staging' && 'stage-' || '' }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set deploy channel
        id: channel
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "channel=prod" >> "$GITHUB_OUTPUT"
          else
            echo "channel=dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate required config
        run: |
          if [ -z "${GAME_ID}" ]; then
            echo "::error::LEGION_GAME_ID is not set (Settings > Secrets and variables > Actions > Variables)."
            exit 1
          fi
          if [ -z "${LEGION_DEPLOY_TOKEN}" ]; then
            echo "::error::The ${{ matrix.target }} deploy token is not set (LEGION_DEPLOY_TOKEN for prod, LEGION_DEPLOY_TOKEN_STAGE for staging)."
            exit 1
          fi

      - name: Normalize image name to lowercase
        run: |
          echo "GAME_ID=${GAME_ID,,}" >> "$GITHUB_ENV"
          echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.GAME_ID }}-server:${{ env.TAG_PREFIX }}${{ steps.channel.outputs.channel }}-${{ github.sha }}

      # roomSize = the room's player cap = WorldRoom's maxClients (ROOM_MAX_CLIENTS in src/constants.ts,
      # 6: one per motel plot). docs.bloxity.io/#html5: never send seatCap, only roomSize.
      - name: Deploy to Legion
        run: |
          ROOM_SIZE=$(grep -oP 'ROOM_MAX_CLIENTS\s*=\s*\K\d+' src/constants.ts)
          if [ -z "${ROOM_SIZE}" ]; then
            echo "::error::Could not read ROOM_MAX_CLIENTS from src/constants.ts."
            exit 1
          fi
          curl -sSf -X POST "${LEGION_URL}/v1/apps/${GAME_ID}/deploy" \
            -H "Authorization: Bearer ${LEGION_DEPLOY_TOKEN}" \
            -H 'Content-Type: application/json' \
            -d "{\"channel\":\"${CHANNEL}\",\"image\":\"${REGISTRY}/${OWNER}/${GAME_ID}-server:${TAG_PREFIX}${CHANNEL}-${{ github.sha }}\",\"version\":\"${{ github.sha }}\",\"roomSize\":${ROOM_SIZE}}"
        env:
          CHANNEL: ${{ steps.channel.outputs.channel }}
